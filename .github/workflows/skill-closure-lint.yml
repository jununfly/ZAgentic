name: Skill runtime-closure lint

# Critical, do NOT "optimise" away:
#
# This workflow reports `closure-lint` on EVERY push / pull_request, because the
# branch has that check as REQUIRED. A required check that never reports is
# treated as unsatisfied, so a path-filtered version would leave every unrelated
# PR (e.g. docs-only, or a PR that only touches skills/foo while another skill
# is clean) stuck on `mergeStateStatus: BLOCKED` with `checks: 0`.
# Verified empirically on the sibling ui-contract gate: probe PR #211 touched
# only docs/ and was BLOCKED solely because a path-filtered required check did
# not report.
#   => Keep this trigger unfiltered. The lint scans the whole skills/ tree and is
#      cheap (~1s); it exits 0 on a clean tree, so unrelated PRs stay green.
on:
  push:
  pull_request:

jobs:
  closure-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run skill runtime-closure lint
        # Scans skills/ for references that escape into the ZAgentic source repo
        # (e.g. ../../docs, docs/ontology) — skills are installed without the
        # docs/ tree, so anything read at runtime must be closed over inside the
        # skill. Pure stdlib; see scripts/check-skill-runtime-closure.py.
        run: python3 scripts/check-skill-runtime-closure.py --repo .

  docs-dangling-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history required: check-adrs.py verifies ADR commit-SHA
        # references with `git cat-file`, and those SHAs are historical
        # ancestors of main. A default shallow checkout (depth 1) lacks the
        # objects, so every PR would falsely fail this gate on pre-existing
        # ADR commit citations. fetch-depth: 0 pulls the whole history.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail on dangling docs/ navigation links
        # Deleting docs/designs/ui-agent-skills/README.md (2026-10-24) left four
        # references behind, one of them written relative
        # (`../designs/ui-agent-skills/README.md`) so a literal path search never
        # finds it. No other workflow reads docs/ links, so this class was
        # silent. Only markdown links fail; bare prose paths are WARN (they are
        # often historical narrative or describe another tree).
        # NOT a required check: keep it out of the branch-protection contexts so
        # an unrelated PR is never blocked by it (see PR #211).
        run: python3 scripts/check-docs-dangling-refs.py --repo-root .
      - name: Verify ADR evidence references
        # ADRs cite skills and commits as decision evidence. A dead commit sha
        # or a renamed/absent skill name is silent fact drift that the
        # dangling-refs gate cannot see (it only scans links/paths and
        # suppresses the retired namespaces ADRs legitimately cite). This makes
        # the evidence layer mechanically checkable on every push / pull_request.
        # NOT a required check (see PR #211): WARN findings never block a merge.
        run: python3 scripts/check-adrs.py --repo-root .

  docs-ontology:
    # Unified documentation ontology (Module G governance + Module P product
    # domain). Keeps the docs<->code drift checks (bucket inventory, bucket-reorg
    # ADR-bearing, skill-discoverable, doc-map binding) exercised on every push /
    # pull_request instead of only when run locally by hand.
    # graph.json is a PRIVATE, gitignored, regenerable cache (the A-Box): it is
    # produced by extract.build_graph and consumed only by validate.py / tests
    # locally. It is never published as an artifact — it is a temporary derived
    # cache for drift detection, not a deliverable knowledge graph.
    # NOT a required check (see PR #211): a red here must never block an unrelated
    # PR's merge. Defects surface as a non-blocking failure to inspect, not a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate unified ontology (Module G + Module P)
        # Single validator: runs native Module P checks and composes the portable
        # skill's Module G checks via subprocess. It regenerates the A-Box graph
        # internally from the live tree (graph.json is a private cache, not an
        # artifact). Exits non-zero on ERROR.
        run: python3 docs/ontology/validate.py
      - name: Run product-domain integration tests
        run: python3 docs/ontology/tests/test_ontology.py
