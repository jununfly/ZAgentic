name: Research compiler contract

on:
  push:
    paths:
      - ".github/workflows/research-compiler-contract.yml"
      - "scripts/update-research-compiler-artifact.py"
      - "research/evaluation/**"
      - "skills/research/zj-research/**"
      - "skills/research/zj-tech-research-report/**"
  pull_request:
    paths:
      - ".github/workflows/research-compiler-contract.yml"
      - "scripts/update-research-compiler-artifact.py"
      - "research/evaluation/**"
      - "skills/research/zj-research/**"
      - "skills/research/zj-tech-research-report/**"

jobs:
  golden-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python skills/research/zj-research/tests/verify_golden_contract.py
      - run: python skills/research/zj-tech-research-report/tests/verify_technical_report.py
