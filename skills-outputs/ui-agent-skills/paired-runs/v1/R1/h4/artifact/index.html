<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · 资料与报销</title>
<style>
  :root { color-scheme: light; --ink:#14181f; --muted:#5b6472; --line:#e2e6ee; --accent:#2f6bff; --bg:#f6f8fc; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:40px 24px 8px; max-width:880px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 6px; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  .grid { max-width:880px; margin:0 auto; padding:0 24px 60px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  a.card { display:block; text-decoration:none; color:inherit; background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; transition:.15s ease; }
  a.card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 10px 24px rgba(47,107,255,.10); }
  .tag { display:inline-block; font-size:12px; color:var(--accent); background:#eef3ff; border-radius:999px; padding:2px 10px; margin-bottom:10px; }
  h2 { font-size:17px; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:14px; }
  ul { margin:10px 0 0; padding-left:18px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>工作台</h1>
  <p class="lead">两个页面共用本地模拟数据，不连接真实后端。</p>
</header>
<main class="grid">
  <a class="card" href="./form.html">
    <span class="tag">页面一</span>
    <h2>个人资料编辑</h2>
    <p class="muted">加载当前资料，边输入边校验，确认后保存。</p>
    <ul>
      <li>昵称必填 · 邮箱格式 · 简介长度上限</li>
      <li>提交中锁定输入，重复点击只生效一次</li>
      <li>服务端 422 / 超时都有明确反馈，可改完重试</li>
    </ul>
  </a>
  <a class="card" href="./approval.html">
    <span class="tag">页面二</span>
    <h2>费用报销审批</h2>
    <p class="muted">申请人填写单据，审批人查看后通过或驳回。</p>
    <ul>
      <li>金额 &gt; 0 · 事由必填 · 附件用模拟引用</li>
      <li>驳回必须写理由，改完重新提交产生新版本</li>
      <li>只有审批人角色能动审批，越权直接拒绝</li>
    </ul>
  </a>
</main>
</body>
</html>
