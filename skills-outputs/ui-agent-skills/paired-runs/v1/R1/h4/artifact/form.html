<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人资料编辑</title>
<style>
  :root { color-scheme: light; --ink:#14181f; --muted:#5b6472; --line:#e2e6ee; --accent:#2f6bff; --bg:#f6f8fc; --bad:#c0392b; --good:#1a7f4b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 64px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  a.back { color:var(--muted); text-decoration:none; font-size:14px; }
  h1 { font-size:22px; margin:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  .state { font-size:12px; padding:3px 10px; border-radius:999px; background:#eef3ff; color:var(--accent); }
  fieldset { border:0; margin:0; padding:0; }
  fieldset[disabled] { opacity:.6; }
  label { display:block; font-weight:600; font-size:14px; margin:16px 0 6px; }
  label:first-of-type { margin-top:0; }
  input, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  input:focus, textarea:focus { outline:2px solid rgba(47,107,255,.25); border-color:var(--accent); }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color:var(--bad); }
  textarea { min-height:96px; resize:vertical; }
  .err { color:var(--bad); font-size:13px; min-height:18px; margin-top:4px; }
  .hint { color:var(--muted); font-size:12px; text-align:right; }
  .actions { display:flex; gap:10px; align-items:center; margin-top:22px; }
  button { font:inherit; border-radius:9px; padding:10px 18px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { cursor:not-allowed; opacity:.5; }
  .banner { margin-top:18px; border-radius:10px; padding:12px 14px; font-size:14px; display:none; }
  .banner.show { display:block; }
  .banner.ok { background:#eaf7f0; color:var(--good); border:1px solid #bfe6d2; }
  .banner.bad { background:#fdeeec; color:var(--bad); border:1px solid #f5c9c3; }
  .banner.warn { background:#fff7e6; color:#8a5a00; border:1px solid #f2dca8; }
  .meta { margin-top:14px; font-size:13px; color:var(--muted); }
  dialog { border:0; border-radius:14px; padding:22px; max-width:400px; box-shadow:0 24px 60px rgba(0,0,0,.18); }
  dialog h2 { margin:0 0 8px; font-size:17px; }
  dialog p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  .row { display:flex; gap:10px; justify-content:flex-end; }
  .mock { margin-top:20px; border-top:1px dashed var(--line); padding-top:14px; font-size:13px; color:var(--muted); }
  select { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./index.html">← 返回工作台</a>
    <span class="state" id="stateChip">idle</span>
  </div>
  <h1>个人资料编辑</h1>

  <form class="card" id="profileForm" novalidate>
    <fieldset id="fields">
      <label for="nickname">昵称</label>
      <input id="nickname" name="nickname" autocomplete="nickname" />
      <div class="err" id="err-nickname"></div>

      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" />
      <div class="err" id="err-email"></div>

      <label for="bio">简介</label>
      <textarea id="bio" name="bio"></textarea>
      <div class="err" id="err-bio"></div>
      <div class="hint"><span id="bioCount">0</span>/200</div>
    </fieldset>

    <div class="actions">
      <button class="primary" id="saveBtn" type="button" disabled>保存资料</button>
      <button id="resetBtn" type="button">放弃修改</button>
    </div>

    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="meta" id="meta"></div>

    <div class="mock">
      模拟服务端响应：
      <select id="mockMode">
        <option value="200">200 成功</option>
        <option value="422">422 约束失败</option>
        <option value="timeout">超时无响应</option>
      </select>
    </div>
  </form>
</div>

<dialog id="confirmDialog">
  <h2>确认保存资料？</h2>
  <p>保存后立即生效。请确认昵称、邮箱与简介无误。</p>
  <div class="row">
    <button id="cancelSave" type="button">再检查一下</button>
    <button class="primary" id="confirmSave" type="button">确认保存</button>
  </div>
</dialog>

<script type="module">
import { createFormSession, FORM_STATES } from "./src/form/session.mjs";
import { errorsByField, BIO_MAX_LENGTH } from "./src/form/validation.mjs";

const CURRENT_PROFILE = { nickname: "zj", email: "zj@example.com", bio: "AI-Native 实践者" };

const session = createFormSession({ profile: CURRENT_PROFILE, initialState: "idle", user: "user-001" });
let seq = 0;

const els = {
  form: document.getElementById("profileForm"),
  fields: document.getElementById("fields"),
  nickname: document.getElementById("nickname"),
  email: document.getElementById("email"),
  bio: document.getElementById("bio"),
  bioCount: document.getElementById("bioCount"),
  save: document.getElementById("saveBtn"),
  reset: document.getElementById("resetBtn"),
  banner: document.getElementById("banner"),
  meta: document.getElementById("meta"),
  chip: document.getElementById("stateChip"),
  dialog: document.getElementById("confirmDialog"),
  confirm: document.getElementById("confirmSave"),
  cancel: document.getElementById("cancelSave"),
  mock: document.getElementById("mockMode"),
};

function showBanner(kind, text) {
  els.banner.className = `banner show ${kind}`;
  els.banner.textContent = text;
}
function hideBanner() {
  els.banner.className = "banner";
  els.banner.textContent = "";
}

function paintErrors(errors) {
  const map = errorsByField(errors);
  for (const field of ["nickname", "email", "bio"]) {
    const holder = document.getElementById(`err-${field}`);
    holder.textContent = map[field] ?? "";
    els[field].setAttribute("aria-invalid", map[field] ? "true" : "false");
  }
}

function render() {
  const state = session.state;
  const errors = session.errors;
  const locked = state === FORM_STATES.SUBMITTING;

  els.chip.textContent = state;
  els.fields.disabled = locked;
  els.save.disabled = locked || errors.length > 0 || state === FORM_STATES.SUCCESS;
  els.reset.disabled = locked;
  els.bioCount.textContent = String(els.bio.value.length);

  const draft = session.draft;
  for (const field of ["nickname", "email", "bio"]) {
    if (document.activeElement !== els[field]) els[field].value = draft[field] ?? "";
  }
  paintErrors(errors);

  const store = session.store;
  els.meta.textContent = store.record
    ? `本地模拟存储：第 ${store.writes} 次写入，最近保存 ${new Date(store.record.saved_at).toLocaleTimeString()}`
    : "本地模拟存储：尚未写入";
}

function onEdit(field) {
  return (event) => {
    const result = session.apply({ seq: ++seq, role: "user", action: "edit", field, value: event.target.value });
    if (result.accepted === false && result.reason === "input_locked") {
      // 提交中锁定：回滚这次输入，避免界面与状态不一致。
      event.target.value = session.draft[field] ?? "";
    }
    hideBanner();
    render();
  };
}

els.nickname.addEventListener("input", onEdit("nickname"));
els.email.addEventListener("input", onEdit("email"));
els.bio.addEventListener("input", onEdit("bio"));

els.save.addEventListener("click", () => {
  const errors = session.errors;
  if (errors.length > 0) {
    showBanner("bad", "还有字段未通过校验，无法保存。");
    render();
    return;
  }
  els.dialog.showModal();
});

els.cancel.addEventListener("click", () => els.dialog.close());

els.confirm.addEventListener("click", async () => {
  els.dialog.close();
  const submitOutcome = session.apply({ seq: ++seq, role: "user", action: "submit", confirmed: true });
  if (!submitOutcome.accepted) {
    showBanner("bad", "提交被拦截：" + submitOutcome.reason);
    render();
    return;
  }
  render();
  showBanner("warn", "正在保存，输入已锁定…");

  const mode = els.mock.value;
  const responseCode = mode === "timeout" ? 0 : Number(mode);
  await new Promise((resolve) => setTimeout(resolve, 450));

  const outcome = session.apply({ seq: ++seq, role: "system", action: "persist", response_code: responseCode });
  render();

  if (outcome.ok) {
    showBanner("ok", "资料已保存。");
    return;
  }
  if (responseCode === 0) {
    showBanner("warn", "请求超时，无法确认是否已保存。我们不会标记为成功，请重新提交。 ");
  } else {
    showBanner("bad", "服务端拒绝了这次保存（422），请修改后重试。");
  }
});

els.reset.addEventListener("click", () => {
  session.apply({ seq: ++seq, role: "user", action: "reset" });
  for (const field of ["nickname", "email", "bio"]) {
    els[field].value = CURRENT_PROFILE[field];
    session.apply({ seq: ++seq, role: "user", action: "edit", field, value: CURRENT_PROFILE[field] });
  }
  hideBanner();
  render();
});

// 首次加载：把当前资料灌入状态机后渲染。
for (const field of ["nickname", "email", "bio"]) {
  session.apply({ seq: ++seq, role: "user", action: "edit", field, value: CURRENT_PROFILE[field] });
}
render();
</script>
</body>
</html>
