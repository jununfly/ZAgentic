<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资料编辑 · 本地 mock</title>
  <link rel="stylesheet" href="./src/ui.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="crumb"><a href="./index.html">工作台</a> / 资料编辑</p>
        <h1>编辑个人资料</h1>
      </div>
      <span class="pill" id="state-pill" data-state="idle">idle</span>
    </header>

    <p class="lede">修改昵称、邮箱与简介。输入时即时校验，校验不通过无法提交；提交期间输入锁定，重复点击只会提交一次。</p>

    <div id="banner" class="banner" role="status" aria-live="polite"></div>

    <div class="split">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">资料</h2>
        <p>数据保存在本地（localStorage），不会发送到任何服务器。</p>

        <form id="profile-form" novalidate>
          <div class="field">
            <label class="label" for="nickname">昵称<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="nickname" name="nickname" autocomplete="nickname"
                   aria-describedby="nickname-err" />
            <p class="err" id="nickname-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="label" for="email">邮箱<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email"
                   aria-describedby="email-err" />
            <p class="err" id="email-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="label" for="bio">简介</label>
            <textarea class="textarea" id="bio" name="bio" aria-describedby="bio-hint bio-err"></textarea>
            <p class="hint" id="bio-hint"><span>最多 120 字</span><span id="bio-count">0/120</span></p>
            <p class="err" id="bio-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="label" for="fault">演示用服务端行为</label>
            <select class="select" id="fault">
              <option value="ok">正常保存（200）</option>
              <option value="constraint">服务端拒绝（422）</option>
              <option value="timeout">请求超时（无响应）</option>
            </select>
          </div>

          <label class="gate" for="confirm">
            <input type="checkbox" id="confirm" />
            <span>我已确认以上资料正确，并同意<b>手动提交保存</b>。系统不会自动提交。</span>
          </label>

          <div class="row">
            <button class="btn btn-primary" id="submit" type="submit" disabled>确认并保存</button>
            <button class="btn" id="recover" type="button" hidden>返回编辑</button>
          </div>
        </form>
      </section>

      <aside class="card" aria-labelledby="saved-title">
        <h2 id="saved-title">最近一次保存</h2>
        <p>只有真正写入本地记录后才会出现在这里。</p>
        <dl class="kv" id="saved"></dl>
        <p class="footnote" id="saved-empty">暂无记录。超时或 422 不会产生记录。</p>
      </aside>
    </div>
  </main>

  <script type="module">
    import { ProfileForm, BIO_MAX, mockPersist } from './src/form/machine.mjs';
    import { createLocalStore } from './src/shared/store.mjs';

    const store = createLocalStore(localStorage, 'mock.profile.v1');
    const seed = (store.record && store.record.profile) || {
      nickname: 'zj',
      email: 'zj@example.com',
      bio: 'AI-Native 实践者',
    };

    const form = new ProfileForm({ profile: seed, store, user: 'user-001' });

    const el = {
      form: document.getElementById('profile-form'),
      nickname: document.getElementById('nickname'),
      email: document.getElementById('email'),
      bio: document.getElementById('bio'),
      confirm: document.getElementById('confirm'),
      submit: document.getElementById('submit'),
      recover: document.getElementById('recover'),
      banner: document.getElementById('banner'),
      pill: document.getElementById('state-pill'),
      saved: document.getElementById('saved'),
      savedEmpty: document.getElementById('saved-empty'),
      fault: document.getElementById('fault'),
      count: document.getElementById('bio-count'),
    };

    const errors = {
      nickname: document.getElementById('nickname-err'),
      email: document.getElementById('email-err'),
      bio: document.getElementById('bio-err'),
    };

    let pending = false;

    function setBanner(kind, title, body) {
      if (!kind) {
        el.banner.hidden = true;
        el.banner.textContent = '';
        el.banner.removeAttribute('data-kind');
        return;
      }
      el.banner.hidden = false;
      el.banner.dataset.kind = kind;
      el.banner.setAttribute('role', kind === 'error' ? 'alert' : 'status');
      el.banner.innerHTML = '';
      const strong = document.createElement('strong');
      strong.textContent = title;
      el.banner.append(strong, document.createTextNode(body));
    }

    function renderSaved() {
      const rec = store.record;
      el.saved.textContent = '';
      el.savedEmpty.hidden = Boolean(rec);
      if (!rec) return;
      const rows = [
        ['昵称', rec.profile.nickname],
        ['邮箱', rec.profile.email],
        ['简介', rec.profile.bio || '（空）'],
        ['写入次数', String(store.writes)],
      ];
      for (const [k, v] of rows) {
        const dt = document.createElement('dt');
        dt.textContent = k;
        const dd = document.createElement('dd');
        dd.textContent = v;
        el.saved.append(dt, dd);
      }
    }

    function render() {
      const locked = form.state === 'submitting' || form.state === 'success';
      el.pill.textContent = form.state;
      el.pill.dataset.state = form.state;

      for (const [key, input] of [['nickname', el.nickname], ['email', el.email], ['bio', el.bio]]) {
        const value = form.profile[key];
        if (input.value !== value) input.value = value;
        input.disabled = locked;
        input.setAttribute('aria-invalid', String(Boolean(form.errors[key])));
        errors[key].textContent = form.errors[key] || '';
      }
      el.count.textContent = `${form.profile.bio.length}/${BIO_MAX}`;

      el.confirm.disabled = locked;
      const canSubmit = form.valid && el.confirm.checked && !locked && !pending;
      el.submit.disabled = !canSubmit;
      el.submit.setAttribute('aria-busy', String(form.state === 'submitting'));
      el.submit.textContent = form.state === 'submitting' ? '正在保存…' : '确认并保存';
      el.recover.hidden = form.state !== 'error';

      if (form.state === 'success') {
        setBanner('success', '已保存', '资料已写入本地 mock 记录，服务端返回 200。');
      } else if (form.state === 'error' && form.lastError) {
        if (form.lastError.kind === 'timeout') {
          setBanner(
            'warn',
            '结果未知：请求超时',
            '没有收到服务端响应，本次没有写入本地记录，也无法确认服务端是否已保存。请核对后再重试；系统不会把它当作保存成功。',
          );
        } else {
          setBanner(
            'error',
            '保存失败（422）',
            '服务端拒绝了本次修改，没有写入本地记录。你可以修改后重新提交。',
          );
        }
      } else if (form.state === 'submitting') {
        setBanner('info', '正在保存…', '输入已锁定，重复点击不会再次提交。');
      } else if (!form.valid && (form.state === 'validating' || form.state === 'error')) {
        setBanner('info', '还有字段需要修正', '修正后提交按钮才可用。');
      } else {
        setBanner('', '', '');
      }

      renderSaved();
    }

    for (const [key, input] of [['nickname', el.nickname], ['email', el.email], ['bio', el.bio]]) {
      input.addEventListener('input', () => {
        form.edit(key, input.value);
        render();
      });
      input.addEventListener('blur', () => {
        form.validate();
        render();
      });
    }

    el.confirm.addEventListener('change', render);

    el.recover.addEventListener('click', () => {
      form.recover();
      render();
    });

    el.form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (pending) return;
      if (form.state === 'error') form.recover();
      const result = form.submit({ confirmed: el.confirm.checked, role: 'user', step: 1 });
      render();
      if (!result.ok) return;

      pending = true;
      el.form.setAttribute('aria-busy', 'true');
      const response = await mockPersist(form.profile, { mode: el.fault.value });
      pending = false;
      el.form.removeAttribute('aria-busy');
      form.persist({ responseCode: response.responseCode });
      render();
    });

    render();
  </script>
</body>
</html>
