<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>费用报销审批 · 本地 mock</title>
  <link rel="stylesheet" href="./src/ui.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="crumb"><a href="./index.html">工作台</a> / 费用报销</p>
        <h1>费用报销审批</h1>
      </div>
      <span class="pill" id="state-pill" data-state="draft">draft</span>
    </header>

    <p class="lede">申请人填单后手动提交；进入审批中后，只有审批人角色可以做出决定，驳回必须填写理由；被驳回后修改会生成新版本，旧版本保留在时间线里。</p>

    <div id="banner" class="banner" role="status" aria-live="polite"></div>

    <div class="split">
      <section class="card" aria-labelledby="request-title">
        <h2 id="request-title">报销单 <span class="pill" id="version-pill">v1</span></h2>
        <p>附件只保存 mock 引用，不上传文件。</p>

        <form id="request-form" novalidate>
          <div class="field">
            <label class="label" for="amount">金额（CNY）<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="amount" inputmode="decimal" autocomplete="off"
                   aria-describedby="amount-err" />
            <p class="err" id="amount-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="label" for="reason">事由<span class="req" aria-hidden="true">*</span></label>
            <textarea class="textarea" id="reason" aria-describedby="reason-err"></textarea>
            <p class="err" id="reason-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="label" for="attachment">附件引用（mock）</label>
            <input class="input" id="attachment" placeholder="mock://receipt-001" aria-describedby="attachment-hint" />
            <p class="hint" id="attachment-hint"><span>形如 mock://receipt-001</span></p>
          </div>

          <label class="gate" for="submit-confirm">
            <input type="checkbox" id="submit-confirm" />
            <span>我确认这张报销单内容无误，并<b>手动提交</b>审批。系统不会自动提交。</span>
          </label>

          <div class="row">
            <button class="btn btn-primary" id="submit-btn" type="submit" disabled>确认并提交</button>
            <button class="btn" id="revise-btn" type="button" hidden>基于驳回意见修改（生成新版本）</button>
          </div>
        </form>
      </section>

      <aside class="card" aria-labelledby="review-title">
        <h2 id="review-title">审批</h2>
        <p>身份仅用于演示权限校验，不涉及登录。</p>

        <div class="field">
          <label class="label" for="role">当前身份</label>
          <select class="select" id="role">
            <option value="applicant">申请人 user-001</option>
            <option value="approver">审批人 approver-001</option>
            <option value="other">其他人 user-006</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="decision-reason">审批意见</label>
          <textarea class="textarea" id="decision-reason" placeholder="通过时可选，驳回时必填"></textarea>
          <p class="err" id="decision-err" role="alert"></p>
        </div>

        <label class="gate" for="decision-confirm">
          <input type="checkbox" id="decision-confirm" />
          <span>我确认以上审批意见，并<b>手动做出决定</b>。决定会写入本地记录。</span>
        </label>

        <div class="row">
          <button class="btn btn-primary" id="approve-btn" type="button" disabled>通过</button>
          <button class="btn btn-danger" id="reject-btn" type="button" disabled>驳回</button>
        </div>

        <p class="section-title">超时与升级</p>
        <div class="row">
          <button class="btn" id="timeout-btn" type="button" disabled>模拟审批超时</button>
        </div>
        <p class="footnote" id="escalation" hidden></p>
      </aside>
    </div>

    <p class="section-title">时间线</p>
    <ul class="timeline" id="timeline"></ul>

    <p class="section-title">本地记录（mock 持久化）</p>
    <dl class="kv" id="record"></dl>
    <p class="footnote" id="record-empty">还没有写入记录。草稿、越权、超时都不会写盘。</p>
  </main>

  <script type="module">
    import { ExpenseApproval } from './src/approval/machine.mjs';
    import { createLocalStore } from './src/shared/store.mjs';

    const store = createLocalStore(localStorage, 'mock.expense.v1');
    const saved = store.record;
    const seed = {
      applicant: (saved && saved.applicant) || 'user-001',
      approver: 'approver-001',
      request: (saved && saved.request) || {
        amount: 1200,
        currency: 'CNY',
        reason: '客户拜访差旅费',
        attachment_ref: 'mock://receipt-001',
      },
      initialState: (saved && saved.status) || 'draft',
      version: (saved && saved.version) || 1,
    };

    const app = new ExpenseApproval({
      request: seed.request,
      applicant: seed.applicant,
      approver: seed.approver,
      store,
      initialState: seed.initialState,
      version: seed.version,
    });

    const el = {
      form: document.getElementById('request-form'),
      amount: document.getElementById('amount'),
      reason: document.getElementById('reason'),
      attachment: document.getElementById('attachment'),
      submitConfirm: document.getElementById('submit-confirm'),
      submitBtn: document.getElementById('submit-btn'),
      reviseBtn: document.getElementById('revise-btn'),
      role: document.getElementById('role'),
      decisionReason: document.getElementById('decision-reason'),
      decisionConfirm: document.getElementById('decision-confirm'),
      decisionErr: document.getElementById('decision-err'),
      approveBtn: document.getElementById('approve-btn'),
      rejectBtn: document.getElementById('reject-btn'),
      timeoutBtn: document.getElementById('timeout-btn'),
      escalation: document.getElementById('escalation'),
      banner: document.getElementById('banner'),
      pill: document.getElementById('state-pill'),
      versionPill: document.getElementById('version-pill'),
      timeline: document.getElementById('timeline'),
      record: document.getElementById('record'),
      recordEmpty: document.getElementById('record-empty'),
    };

    const errors = {
      amount: document.getElementById('amount-err'),
      reason: document.getElementById('reason-err'),
    };

    function setBanner(kind, title, body) {
      if (!kind) {
        el.banner.hidden = true;
        el.banner.textContent = '';
        el.banner.removeAttribute('data-kind');
        return;
      }
      el.banner.hidden = false;
      el.banner.dataset.kind = kind;
      el.banner.setAttribute('role', kind === 'error' ? 'alert' : 'status');
      el.banner.innerHTML = '';
      const strong = document.createElement('strong');
      strong.textContent = title;
      el.banner.append(strong, document.createTextNode(body));
    }

    function lastReason() {
      for (let i = app.history.length - 1; i >= 0; i -= 1) {
        if (app.history[i].type === 'reject') return app.history[i].reason;
      }
      return '';
    }

    function renderTimeline() {
      el.timeline.textContent = '';
      if (!app.history.length) {
        const li = document.createElement('li');
        li.append(document.createTextNode('还没有动作。填写报销单并手动提交后开始记录。'));
        el.timeline.append(li);
        return;
      }
      const labels = {
        submit: (h) => `v${h.version} 已提交`,
        route: (h) => `v${h.version} 进入审批中`,
        approve: (h) => `v${h.version} 通过：${h.reason || '无附加意见'}`,
        reject: (h) => `v${h.version} 驳回：${h.reason}`,
        revise: (h) => `基于驳回意见生成 v${h.version} 草稿`,
        escalated: (h) => `v${h.version} 审批超时，已升级等待人工接管`,
        denied: (h) => `${h.role} 的审批请求被拒绝（${h.reason}）`,
      };
      for (const h of app.history) {
        const li = document.createElement('li');
        li.dataset.done = 'true';
        if (h.type === 'reject' || h.type === 'denied') li.dataset.tone = 'bad';
        const b = document.createElement('b');
        b.textContent = labels[h.type] ? labels[h.type](h) : h.type;
        li.append(b);
        el.timeline.append(li);
      }
    }

    function renderRecord() {
      el.record.textContent = '';
      const rec = store.record;
      el.recordEmpty.hidden = Boolean(rec);
      if (!rec) return;
      const rows = [
        ['状态', rec.status],
        ['版本', `v${rec.version}`],
        ['申请人', rec.applicant],
        ['金额', `${rec.request.amount} ${rec.request.currency}`],
        ['事由', rec.request.reason],
        ['决定', rec.decision ? `${rec.decision.outcome}${rec.decision.reason ? '：' + rec.decision.reason : ''}` : '（未决定）'],
        ['写入次数', String(store.writes)],
      ];
      for (const [k, v] of rows) {
        const dt = document.createElement('dt');
        dt.textContent = k;
        const dd = document.createElement('dd');
        dd.textContent = v;
        el.record.append(dt, dd);
      }
    }

    function render() {
      const locked = !app.editable;
      el.pill.textContent = app.state;
      el.pill.dataset.state = app.state;
      el.versionPill.textContent = `v${app.version}`;

      const values = {
        amount: String(app.request.amount || ''),
        reason: app.request.reason,
        attachment: app.request.attachment_ref || '',
      };
      for (const [key, input] of [['amount', el.amount], ['reason', el.reason], ['attachment', el.attachment]]) {
        if (input.value !== values[key] && document.activeElement !== input) input.value = values[key];
        input.disabled = locked;
        if (errors[key]) {
          input.setAttribute('aria-invalid', String(Boolean(app.errors[key])));
          errors[key].textContent = app.errors[key] || '';
        }
      }

      el.submitConfirm.disabled = locked;
      const canSubmit = app.editable && app.errorFields.length === 0 && el.submitConfirm.checked;
      el.submitBtn.disabled = !canSubmit;
      el.submitBtn.textContent =
        app.state === 'rejected' ? '已驳回' : locked ? '已提交' : '确认并提交';
      el.reviseBtn.hidden = app.state !== 'rejected';

      const deciding = app.state === 'under_review';
      const gateReady = deciding && el.decisionConfirm.checked;
      el.approveBtn.disabled = !gateReady;
      el.rejectBtn.disabled = !gateReady;
      el.timeoutBtn.disabled = !deciding;

      el.escalation.hidden = !app.escalation;
      if (app.escalation) {
        el.escalation.textContent =
          '已升级：审批超时，单据保持「审批中」，不会自动通过或驳回。请由人工在审批队列中接管处理。';
      }

      if (app.state === 'approved') {
        setBanner('success', '已通过', `审批决定已写入本地记录（v${app.version}）。`);
      } else if (app.state === 'rejected') {
        setBanner('warn', '已驳回', `理由：${lastReason() || '—'}。你可以基于意见修改后重新提交，旧版本保留。`);
      } else if (app.denied) {
        const map = { role_not_approver: '当前身份不是审批人', self_approval_forbidden: '不能审批自己提交的单据' };
        setBanner('error', '无权审批', `${map[app.denied.reason] || app.denied.reason}，单据状态没有变化。`);
      } else if (deciding) {
        setBanner('info', '审批中', '只有审批人角色可以做出决定，且需要先勾选确认。');
      } else if (app.state === 'submitted') {
        setBanner('info', '已提交', '等待路由到审批人。');
      } else if (app.errorFields.length) {
        setBanner('error', '无法提交', '金额必须大于 0，事由必填。修正后按钮才可用。');
      } else {
        setBanner('', '', '');
      }

      renderTimeline();
      renderRecord();
    }

    for (const [key, input] of [['amount', el.amount], ['reason', el.reason], ['attachment', el.attachment]]) {
      input.addEventListener('input', () => {
        const value = key === 'attachment' ? (input.value || null) : input.value;
        app.updateField(key, value);
        render();
      });
    }

    el.submitConfirm.addEventListener('change', render);
    el.decisionConfirm.addEventListener('change', render);

    el.form.addEventListener('submit', (event) => {
      event.preventDefault();
      const result = app.submit({ confirmed: el.submitConfirm.checked, role: 'applicant', actor: seed.applicant });
      if (result.ok) app.route();
      render();
    });

    function actorForRole() {
      if (el.role.value === 'approver') return { role: 'approver', actor: seed.approver };
      if (el.role.value === 'applicant') return { role: 'applicant', actor: seed.applicant };
      return { role: 'other', actor: 'user-006' };
    }

    el.approveBtn.addEventListener('click', () => {
      const { role, actor } = actorForRole();
      app.approve({
        role,
        actor,
        reason: el.decisionReason.value.trim(),
        confirmed: el.decisionConfirm.checked,
      });
      render();
    });

    el.rejectBtn.addEventListener('click', () => {
      const { role, actor } = actorForRole();
      const result = app.reject({
        role,
        actor,
        reason: el.decisionReason.value.trim(),
        confirmed: el.decisionConfirm.checked,
      });
      el.decisionErr.textContent = result.ok ? '' : result.reason === 'reason_required' ? '驳回必须填写理由' : '';
      render();
    });

    el.timeoutBtn.addEventListener('click', () => {
      app.timeout();
      render();
    });

    el.reviseBtn.addEventListener('click', () => {
      app.revise();
      el.decisionErr.textContent = '';
      el.submitConfirm.checked = false;
      el.decisionConfirm.checked = false;
      render();
    });

    render();
  </script>
</body>
</html>
