<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户资料编辑</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f7f9;
        --text: #1f2430;
        --muted: #5a6472;
        --border: #cbd2dc;
        --accent: #1a56db;
        --error: #b42318;
        --success: #067647;
        --warn: #8a5a00;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--surface);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; }
      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 16px;
      }
      nav a { color: var(--accent); margin-right: 12px; }
      label { display: block; margin: 12px 0 4px; }
      input, textarea, select, button {
        font: inherit;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        width: 100%;
        box-sizing: border-box;
      }
      textarea { min-height: 88px; resize: vertical; }
      button { cursor: pointer; width: auto; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button[disabled] { opacity: 0.55; cursor: not-allowed; }
      input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--error); }
      .error-text { color: var(--error); font-size: 13px; margin: 2px 0 8px; }
      .muted { color: var(--muted); font-size: 13px; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 13px;
      }
      .badge[data-tone="success"] { border-color: var(--success); color: var(--success); }
      .badge[data-tone="error"] { border-color: var(--error); color: var(--error); }
      .badge[data-tone="busy"] { border-color: var(--warn); color: var(--warn); }
      .banner { margin-top: 12px; padding: 8px; border-radius: 6px; border: 1px solid var(--error); color: var(--error); }
      .banner[data-tone="success"] { border-color: var(--success); color: var(--success); }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      ul.timeline { padding-left: 18px; }
      dialog { border: 1px solid var(--border); border-radius: 6px; padding: 16px; max-width: 420px; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="./index.html">用户资料编辑</a>
        <a href="./approval.html">费用报销审批</a>
      </nav>
      <h1>用户资料编辑</h1>
      <p class="muted">资料来自本地 mock 存储，没有真实后端；提交需要你本人确认。</p>

      <section class="card">
        <div class="row">
          <span class="badge" id="state-badge" data-tone="idle">idle</span>
          <span class="muted" id="meta"></span>
        </div>

        <form id="profile-form" novalidate>
          <label for="nickname">昵称（必填）</label>
          <input id="nickname" name="nickname" autocomplete="off" aria-describedby="err-nickname" />
          <p class="error-text" id="err-nickname" role="alert"></p>

          <label for="email">邮箱</label>
          <input id="email" name="email" autocomplete="off" aria-describedby="err-email" />
          <p class="error-text" id="err-email" role="alert"></p>

          <label for="bio">简介（长度上限 <span id="bio-max">200</span> 字）</label>
          <textarea id="bio" name="bio" aria-describedby="err-bio bio-counter"></textarea>
          <p class="muted" id="bio-counter"></p>
          <p class="error-text" id="err-bio" role="alert"></p>
        </form>

        <label for="server-behavior">模拟服务端响应</label>
        <select id="server-behavior">
          <option value="200">200 · 保存成功</option>
          <option value="422">422 · 服务端校验失败</option>
          <option value="0">超时 · 无响应</option>
        </select>

        <div class="row" style="margin-top: 12px">
          <button id="submit-btn" class="primary" type="button">提交修改</button>
          <button id="recover-btn" type="button" hidden>回到编辑，修正后重提</button>
        </div>

        <div class="banner" id="banner" role="status" hidden></div>
      </section>

      <section class="card">
        <h2 style="font-size: 15px; margin-top: 0">Human gate 记录</h2>
        <ul class="timeline" id="gates">
          <li class="muted">暂无签名记录</li>
        </ul>
      </section>
    </main>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title" style="font-size: 16px; margin-top: 0">确认提交资料</h2>
      <p class="muted">提交会把当前资料写入本地 mock 存储。这一步由你本人确认，系统不会自动提交。</p>
      <div class="row" style="justify-content: flex-end">
        <button id="confirm-cancel" type="button">取消</button>
        <button id="confirm-ok" class="primary" type="button">我确认提交</button>
      </div>
    </dialog>

    <script type="module" src="./src/form/app.mjs"></script>
  </body>
</html>
