<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户资料编辑 / 费用报销审批</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f6f7f9; color: #1c1f23; }
  header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e3e6ea; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .tabs button { margin-right: 8px; padding: 6px 14px; border: 1px solid #c9ced6; background: #fff; border-radius: 6px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: #2563eb; color: #fff; border-color: #2563eb; }
  main { max-width: 760px; margin: 20px auto; padding: 0 16px; }
  section { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 16px; margin-top: 0; }
  .row { margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #4a5058; }
  input[type="text"], input[type="number"], textarea, select { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccd2da; border-radius: 6px; font: inherit; }
  textarea { min-height: 70px; }
  .err { color: #d92d20; font-size: 12px; min-height: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .actions button { padding: 7px 14px; border-radius: 6px; border: 1px solid #c9ced6; background: #fff; cursor: pointer; }
  .actions button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .actions button.danger { background: #fff; color: #d92d20; border-color: #d92d20; }
  .gate { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 10px; }
  .meta { font-size: 13px; color: #4a5058; }
  .meta b { color: #1c1f23; }
  .log { margin-top: 12px; border-top: 1px dashed #dfe3e8; padding-top: 8px; font-size: 12px; color: #4a5058; max-height: 160px; overflow: auto; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>本地 mock 双流程</h1>
  <div class="tabs">
    <button id="tab-form" aria-selected="true">用户资料编辑</button>
    <button id="tab-approval" aria-selected="false">费用报销审批</button>
  </div>
</header>

<main>
  <section id="panel-form">
    <h2>用户资料编辑</h2>
    <div class="row">
      <label for="f-nickname">昵称（必填）</label>
      <input id="f-nickname" type="text" />
      <div class="err" id="f-err-nickname"></div>
    </div>
    <div class="row">
      <label for="f-email">邮箱（格式校验）</label>
      <input id="f-email" type="text" />
      <div class="err" id="f-err-email"></div>
    </div>
    <div class="row">
      <label for="f-bio">简介（长度上限 120）</label>
      <textarea id="f-bio"></textarea>
      <div class="err" id="f-err-bio"></div>
    </div>
    <div class="row">
      <label for="f-response">服务端响应（mock）</label>
      <select id="f-response">
        <option value="200">200 成功</option>
        <option value="422">422 服务端约束失败</option>
        <option value="0">超时（无响应）</option>
      </select>
    </div>
    <div class="gate">
      <input id="f-confirm" type="checkbox" />
      <label for="f-confirm" style="margin:0">我确认提交本次修改（人工确认）</label>
    </div>
    <div class="actions">
      <button id="f-submit" class="primary">提交</button>
      <button id="f-recover">失败后恢复编辑</button>
      <button id="f-reset">查看已持久化资料</button>
    </div>
    <div class="meta">状态：<b id="f-state">idle</b></div>
    <div class="log" id="f-log"></div>
  </section>

  <section id="panel-approval">
    <h2>费用报销审批</h2>
    <div class="row">
      <label for="a-amount">金额（必须 &gt; 0）</label>
      <input id="a-amount" type="number" step="0.01" />
      <div class="err" id="a-err-amount"></div>
    </div>
    <div class="row">
      <label for="a-reason">事由（必填）</label>
      <input id="a-reason" type="text" />
      <div class="err" id="a-err-reason"></div>
    </div>
    <div class="row">
      <label for="a-attachment">附件引用（mock）</label>
      <input id="a-attachment" type="text" />
    </div>
    <div class="row">
      <label for="a-actor">当前操作身份</label>
      <select id="a-actor">
        <option value="applicant">申请人 user-001</option>
        <option value="approver">审批人 approver-001</option>
        <option value="user-006">其它人 user-006</option>
      </select>
    </div>
    <div class="row">
      <label for="a-decision-reason">审批意见（驳回必填）</label>
      <input id="a-decision-reason" type="text" />
    </div>
    <div class="gate">
      <input id="a-confirm" type="checkbox" />
      <label for="a-confirm" style="margin:0">我确认本次提交 / 审批决定（人工确认）</label>
    </div>
    <div class="actions">
      <button id="a-submit" class="primary">提交申请</button>
      <button id="a-route">路由到审批人</button>
      <button id="a-approve">审批通过</button>
      <button id="a-reject" class="danger">驳回</button>
      <button id="a-timeout">模拟审批超时</button>
      <button id="a-revise">基于驳回创建新版本</button>
    </div>
    <div class="meta">状态：<b id="a-state">draft</b> ｜ 版本：<b id="a-version">1</b></div>
    <div class="log" id="a-log"></div>
  </section>
</main>

<script type="module">
  import { mountForm } from './src/form/ui.mjs';
  import { mountApproval } from './src/approval/ui.mjs';

  const formBtn = document.getElementById('tab-form');
  const approvalBtn = document.getElementById('tab-approval');
  function show(which) {
    const isForm = which === 'form';
    document.getElementById('panel-form').classList.toggle('hidden', !isForm);
    document.getElementById('panel-approval').classList.toggle('hidden', isForm);
    formBtn.setAttribute('aria-selected', String(isForm));
    approvalBtn.setAttribute('aria-selected', String(!isForm));
  }
  formBtn.addEventListener('click', () => show('form'));
  approvalBtn.addEventListener('click', () => show('approval'));

  mountForm(document, { user: 'user-001' });
  mountApproval(document, { applicant: 'user-001', approver: 'approver-001' });
  show('form');
</script>
</body>
</html>
