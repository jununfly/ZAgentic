<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地 Mock 双页面 · 资料编辑 &amp; 费用报销审批</title>
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --ink: #1f2937; --muted: #6b7280;
    --line: #e5e7eb; --primary: #2563eb; --primary-ink: #ffffff;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    --err-bg: #fef2f2; --ok-bg: #f0fdf4; --warn-bg: #fffbeb;
    --radius: 10px; --space: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 8px; padding: 14px 24px 0; }
  .tab { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
    padding: 10px 16px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--surface); }
  main { padding: 0 24px 40px; }
  .panel { display: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 24px; margin-top: -1px; }
  .panel.active { display: block; }
  .card { max-width: 560px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .req::after { content: " *"; color: var(--err); }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; background: #fff; color: var(--ink); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--err); }
  .field-error { color: var(--err); font-size: 13px; margin-top: 4px; min-height: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .banner { margin: 16px 0 0; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  .banner.show { display: block; }
  .banner.err { background: var(--err-bg); color: var(--err); border: 1px solid #fecaca; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #bbf7d0; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #fde68a; }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .status code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill.idle,.pill.draft,.pill.validating,.pill.submitted { background:#e0e7ff; color:#3730a3; }
  .pill.submitting,.pill.under_review { background:#fef9c3; color:#854d0e; }
  .pill.success,.pill.approved { background:#dcfce7; color:#166534; }
  .pill.error,.pill.rejected { background:#fee2e2; color:#991b1b; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin-top: 18px; padding: 12px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1>本地 Mock 双页面</h1>
  <p>两个页面都用本地 mock 数据，无真实后端。所有状态迁移均可从 UI 触发，关键动作需用户/审批人显式确认。</p>
</header>

<nav class="tabs" role="tablist" aria-label="页面切换">
  <button class="tab" role="tab" id="tab-profile" aria-selected="true" aria-controls="panel-profile">用户资料编辑</button>
  <button class="tab" role="tab" id="tab-approval" aria-selected="false" aria-controls="panel-approval">费用报销审批</button>
</nav>

<main>
  <!-- ===================== 页面一：资料编辑 ===================== -->
  <section class="panel active" id="panel-profile" role="tabpanel" aria-labelledby="tab-profile">
    <div class="card">
      <h2>用户资料编辑表单</h2>
      <button id="pf-load" class="primary">加载当前资料</button>
      <div class="hint">加载后展示昵称 / 邮箱 / 简介，并可在下方实时编辑。</div>

      <form id="pf-form" novalidate>
        <label class="req" for="pf-nickname">昵称</label>
        <input id="pf-nickname" name="nickname" type="text" autocomplete="off" aria-describedby="pf-nickname-err" />
        <div class="field-error" id="pf-nickname-err" aria-live="polite"></div>

        <label class="req" for="pf-email">邮箱</label>
        <input id="pf-email" name="email" type="email" autocomplete="off" aria-describedby="pf-email-err" />
        <div class="field-error" id="pf-email-err" aria-live="polite"></div>

        <label for="pf-bio">简介</label>
        <textarea id="pf-bio" name="bio" rows="3" maxlength="200" aria-describedby="pf-bio-err"></textarea>
        <div class="field-error" id="pf-bio-err" aria-live="polite"></div>

        <fieldset>
          <legend>模拟服务端返回（演示用）</legend>
          <div class="row">
            <label style="margin:0"><input type="radio" name="pf-scenario" value="200" checked style="width:auto"> 正常 200</label>
            <label style="margin:0"><input type="radio" name="pf-scenario" value="422" style="width:auto"> 422 约束错误</label>
            <label style="margin:0"><input type="radio" name="pf-scenario" value="0" style="width:auto"> 超时 0</label>
          </div>
        </fieldset>

        <div class="row" style="margin-top:18px">
          <button id="pf-submit" class="primary" type="submit" disabled>提交资料（需确认）</button>
          <button id="pf-recover" type="button" hidden>恢复并重新编辑</button>
        </div>
      </form>

      <div id="pf-banner" class="banner" role="alert" aria-live="assertive"></div>

      <div class="status">
        状态：<span class="pill" id="pf-state">idle</span>
        <span id="pf-gates"></span>
      </div>
    </div>
  </section>

  <!-- ===================== 页面二：费用报销审批 ===================== -->
  <section class="panel" id="panel-approval" role="tabpanel" aria-labelledby="tab-approval" hidden>
    <div class="card">
      <h2>费用报销审批</h2>

      <label for="ap-role">当前操作角色</label>
      <select id="ap-role">
        <option value="applicant">申请人 (applicant)</option>
        <option value="approver">审批人 (approver)</option>
        <option value="system">系统 (system)</option>
      </select>
      <div class="hint">审批动作只能由「审批人」角色发起，其它角色调用会被拒绝且状态不前进。</div>

      <fieldset>
        <legend>报销单（申请人填写）</legend>
        <label class="req" for="ap-amount">金额（元，&gt;0）</label>
        <input id="ap-amount" name="amount" type="number" step="0.01" min="0" value="1200" aria-describedby="ap-amount-err" />
        <div class="field-error" id="ap-amount-err" aria-live="polite"></div>

        <label class="req" for="ap-reason">事由</label>
        <input id="ap-reason" name="reason" type="text" value="客户拜访差旅费" aria-describedby="ap-reason-err" />
        <div class="field-error" id="ap-reason-err" aria-live="polite"></div>

        <label for="ap-attach">附件引用（mock）</label>
        <input id="ap-attach" name="attachment_ref" type="text" value="mock://receipt-001" />
      </fieldset>

      <div class="row" style="margin-top:16px">
        <button id="ap-submit" class="primary">提交报销单（需确认）</button>
        <button id="ap-route" type="button">路由到审批中</button>
        <button id="ap-timeout" type="button">模拟超时 / 升级</button>
      </div>

      <fieldset id="ap-decide-box">
        <legend>审批决定（仅审批人）</legend>
        <label for="ap-reject-reason">驳回理由（驳回必填）</label>
        <input id="ap-reject-reason" type="text" placeholder="如：票据不完整，请补正" />
        <div class="row" style="margin-top:10px">
          <button id="ap-approve" class="primary" type="button">通过（需确认）</button>
          <button id="ap-reject" class="danger" type="button">驳回（需确认）</button>
        </div>
      </fieldset>

      <div class="row" style="margin-top:12px">
        <button id="ap-revise" type="button" hidden>修改并重新提交（新一版）</button>
      </div>

      <div id="ap-banner" class="banner" role="alert" aria-live="assertive"></div>

      <div class="status">
        状态：<span class="pill" id="ap-state">draft</span>
        <span id="ap-gates"></span>
        版本：<code id="ap-version">1</code>
      </div>
    </div>
  </section>
</main>

<div class="visually-hidden" aria-live="polite" id="sr-status"></div>

<script type="module">
  import { createProfileFormMachine } from './src/form/machine.mjs';
  import { createProfileApi } from './src/form/persistence.mjs';
  import { createApprovalMachine } from './src/approval/machine.mjs';
  import { createApprovalApi } from './src/approval/persistence.mjs';

  // ---------- 通用 ----------
  const $ = (id) => document.getElementById(id);
  function setPill(el, state) { el.textContent = state; el.className = 'pill ' + state; }
  function banner(el, kind, msg) {
    el.className = 'banner show ' + kind; el.textContent = msg;
  }
  function clearBanner(el) { el.className = 'banner'; el.textContent = ''; }
  function renderGates(el, gates) {
    el.innerHTML = gates.length
      ? ' · 确认记录：' + gates.map(g => `${g.role}@${g.at_step}:${g.signed ? '✓' : '✗'}`).join(' ')
      : '';
  }

  // ---------- Tab 切换 ----------
  const tabs = { profile: $('tab-profile'), approval: $('tab-approval') };
  const panels = { profile: $('panel-profile'), approval: $('panel-approval') };
  function selectTab(name) {
    for (const k of Object.keys(tabs)) {
      const on = k === name;
      tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
      panels[k].classList.toggle('active', on);
      panels[k].hidden = !on;
    }
  }
  tabs.profile.addEventListener('click', () => selectTab('profile'));
  tabs.approval.addEventListener('click', () => selectTab('approval'));

  // ===================== 页面一：资料编辑 =====================
  const pfInitial = { nickname: 'zj', email: 'zj@example.com', bio: 'AI-Native 实践者' };
  const pfApi = createProfileApi({ latency: 0 });

  function pfTransport(scenario) {
    return (_payload, park) => new Promise((resolve) => {
      park(resolve); // 遵循 contract：暴露 park resolver
      const code = scenario === '422' ? 422 : scenario === '0' ? 0 : 200;
      const delay = scenario === '0' ? 1600 : 600; // 超时演示延迟更长
      setTimeout(() => resolve({ code }), delay);
    });
  }

  let pfMachine = null;

  function pfNewMachine() {
    const scenario = document.querySelector('input[name="pf-scenario"]:checked').value;
    return createProfileFormMachine({
      user: 'user-001',
      profile: { ...pfInitial },
      initialState: 'idle',
      api: pfApi,
      transport: pfTransport(scenario),
    });
  }

  function pfRender() {
    const s = pfMachine.snapshot();
    setPill($('pf-state'), s.final_state);
    renderGates($('pf-gates'), s.human_gates);
    const blocked = s.submit_blocked;
    $('pf-submit').disabled = blocked || s.final_state === 'submitting' || s.final_state === 'success';
    $('pf-recover').hidden = !(s.final_state === 'error' && s.recoverable);
    // 错误态反馈
    if (s.final_state === 'error') {
      if (s.fallback === 'stable_path' && s.explicit_marker) {
        banner($('pf-banner'), 'warn', '提交超时：未保存成功，已回退到稳定路径（显式标记）。请稍后重试或检查网络。');
      } else if (s.recoverable) {
        banner($('pf-banner'), 'err', '服务端返回 422：保存失败。请修改后重新提交（可恢复）。');
      }
    } else if (s.final_state === 'success') {
      banner($('pf-banner'), 'ok', '资料保存成功（mock 200）。');
    }
  }

  function pfValidateLive() {
    pfMachine.profile.nickname = $('pf-nickname').value;
    pfMachine.profile.email = $('pf-email').value;
    pfMachine.profile.bio = $('pf-bio').value;
    pfMachine.validate();
    const s = pfMachine.snapshot();
    const map = { nickname: 'pf-nickname', email: 'pf-email', bio: 'pf-bio' };
    const errMap = { nickname: 'pf-nickname-err', email: 'pf-email-err', bio: 'pf-bio-err' };
    const msgs = {
      nickname: '昵称为必填项',
      email: '邮箱格式不正确',
      bio: '简介长度超出上限（140 字）',
    };
    for (const f of ['nickname', 'email', 'bio']) {
      const bad = s.error_fields.includes(f);
      $(map[f]).setAttribute('aria-invalid', bad ? 'true' : 'false');
      $(errMap[f]).textContent = bad ? msgs[f] : '';
    }
    pfRender();
  }

  $('pf-load').addEventListener('click', () => {
    pfMachine = pfNewMachine();
    pfMachine.load();
    pfMachine.edit('nickname'); // 进入 validating，展示当前资料
    $('pf-nickname').value = pfInitial.nickname;
    $('pf-email').value = pfInitial.email;
    $('pf-bio').value = pfInitial.bio;
    clearBanner($('pf-banner'));
    pfValidateLive();
  });

  ['pf-nickname', 'pf-email', 'pf-bio'].forEach((id) =>
    $(id).addEventListener('input', () => { if (pfMachine) pfValidateLive(); }));

  document.querySelectorAll('input[name="pf-scenario"]').forEach((r) =>
    r.addEventListener('change', () => { if (pfMachine) pfMachine = pfNewMachine(), pfMachine.load(),
      pfMachine.edit('nickname'), pfValidateLive(); }));

  $('pf-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pfMachine) return;
    pfValidateLive();
    if (pfMachine.snapshot().submit_blocked) {
      banner($('pf-banner'), 'err', '校验未通过，禁止提交。');
      return;
    }
    const ok = window.confirm('确认提交资料？此操作需你显式确认。');
    if (!ok) return;
    clearBanner($('pf-banner'));
    pfMachine.submit({ role: 'user', atStep: 1, confirmed: true });
    pfRender();
    // submit 内部 await transport，结束后需要刷新一次
    setTimeout(pfRender, 1700);
  });

  $('pf-recover').addEventListener('click', () => {
    pfMachine.recover();
    clearBanner($('pf-banner'));
    pfValidateLive();
  });

  // ===================== 页面二：费用报销审批 =====================
  const apApi = createApprovalApi({ latency: 0 });
  let apMachine = createApprovalMachine({
    requestId: 'expense-ui', applicantId: 'user-001', approverId: 'approver-001',
    request: { amount: 1200, currency: 'CNY', reason: '客户拜访差旅费', attachment_ref: 'mock://receipt-001' },
    initialState: 'draft', api: apApi,
  });

  function apReadRequest() {
    apMachine.request.amount = Number($('ap-amount').value);
    apMachine.request.reason = $('ap-reason').value;
    apMachine.request.attachment_ref = $('ap-attach').value || null;
  }

  function apValidateLive() {
    apReadRequest();
    const errs = [];
    const amt = Number($('ap-amount').value);
    const reason = $('ap-reason').value.trim();
    if (!(Number.isFinite(amt) && amt > 0)) errs.push('amount');
    if (reason.length === 0) errs.push('reason');
    $('ap-amount').setAttribute('aria-invalid', errs.includes('amount') ? 'true' : 'false');
    $('ap-reason').setAttribute('aria-invalid', errs.includes('reason') ? 'true' : 'false');
    $('ap-amount-err').textContent = errs.includes('amount') ? '金额必须大于 0' : '';
    $('ap-reason-err').textContent = errs.includes('reason') ? '事由为必填项' : '';
    apMachine.error_fields = errs;
    apRender();
  }

  function apRender() {
    const s = apMachine.snapshot();
    setPill($('ap-state'), s.final_state);
    $('ap-version').textContent = apMachine.version;
    renderGates($('ap-gates'), s.human_gates);
    const role = $('ap-role').value;
    const st = s.final_state;
    $('ap-submit').disabled = st !== 'draft';
    $('ap-route').disabled = st !== 'submitted';
    $('ap-timeout').disabled = st !== 'under_review';
    $('ap-approve').disabled = st !== 'under_review' || role !== 'approver';
    $('ap-reject').disabled = st !== 'under_review' || role !== 'approver';
    $('ap-revise').hidden = st !== 'rejected';
    if (st === 'approved') banner($('ap-banner'), 'ok', '审批通过，已持久化（mock）。');
    else if (st === 'rejected') banner($('ap-banner'), 'err', '已驳回：' + (apMachine.reject_reason || '（未填理由）') + '。申请人可修改重提交形成新一版。');
    else if (st === 'under_review') banner($('ap-banner'), 'warn', '审批中。' + (apMachine.escalated ? '已触发升级，等待人工接管。' : ''));
    else clearBanner($('ap-banner'));
  }

  $('ap-role').addEventListener('change', apRender);
  ['ap-amount', 'ap-reason', 'ap-attach'].forEach((id) =>
    $(id).addEventListener('input', apValidateLive));

  $('ap-submit').addEventListener('click', async () => {
    apValidateLive();
    if (apMachine.error_fields.length > 0) {
      banner($('ap-banner'), 'err', '校验未通过，禁止提交。'); return;
    }
    const ok = window.confirm('确认提交报销单？此操作需申请人显式确认。');
    if (!ok) return;
    await apMachine.submit({ requestedRole: 'applicant', atStep: 1, confirmed: true });
    apRender();
  });

  $('ap-route').addEventListener('click', () => {
    apMachine.route({ atStep: 2 });
    apRender();
  });

  $('ap-timeout').addEventListener('click', () => {
    apMachine.timeout({ escalate: true, atStep: 3 });
    banner($('ap-banner'), 'warn', '审批超时：未伪造结果，已升级等待人工接管，状态保持「审批中」。');
    apRender();
  });

  $('ap-approve').addEventListener('click', async () => {
    const ok = window.confirm('确认通过该报销单？需审批人显式确认。');
    if (!ok) return;
    await apMachine.decide({ kind: 'approve', requestedRole: 'approver', atStep: 3 });
    apRender();
  });

  $('ap-reject').addEventListener('click', async () => {
    const reason = $('ap-reject-reason').value.trim();
    if (!reason) { banner($('ap-banner'), 'err', '驳回必须填写理由。'); return; }
    const ok = window.confirm('确认驳回该报销单？需审批人显式确认。');
    if (!ok) return;
    await apMachine.decide({ kind: 'reject', requestedRole: 'approver', reason, atStep: 3 });
    apRender();
  });

  $('ap-revise').addEventListener('click', () => {
    apMachine.revise({ atStep: 4 });
    $('ap-reject-reason').value = '';
    clearBanner($('ap-banner'));
    apValidateLive();
  });

  apValidateLive();
</script>
</body>
</html>
