<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户资料编辑</title>
<style>
  :root {
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --muted: #5B6472;
    --primary: #1F5EFF;
    --on-primary: #FFFFFF;
    --danger: #B42318;
    --border: #D0D5DD;
    --radius-control: 8px;
    --radius-card: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .shell { width: 100%; max-width: 520px; }

  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
  }

  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }

  .muted { color: var(--muted); margin: 0 0 24px; }

  .banner {
    margin: 0 0 20px;
    padding: 12px 14px;
    border-radius: var(--radius-control);
    border: 1px solid var(--border);
    background: #F7F9FF;
    color: var(--text);
  }

  .banner[data-kind="success"] { border-color: #2F6B4F; background: #F2F8F4; }
  .banner[data-kind="error"] { border-color: var(--danger); background: #FFF5F4; color: var(--danger); }

  fieldset {
    margin: 0;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
  }

  fieldset[disabled] { opacity: 0.72; }

  .field { display: grid; gap: 6px; margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }

  label { font-size: 13px; font-weight: 600; }

  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    padding: 10px 12px;
    transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
  }

  textarea { min-height: 96px; resize: vertical; }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  input.invalid, textarea.invalid { border-color: var(--danger); }

  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .error { margin: 0; font-size: 12px; color: var(--danger); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 20px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: var(--radius-control);
    border: 1px solid transparent;
    padding: 10px 18px;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }

  button.primary { background: var(--primary); color: var(--on-primary); }
  button.primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--text); }

  .dev { margin-top: 24px; font-size: 13px; color: var(--muted); }
  .dev summary { cursor: pointer; }
  .dev label { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-weight: 400; }
  .dev input { width: auto; }

  dialog {
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px;
    max-width: 420px;
    color: var(--text);
  }

  dialog::backdrop { background: rgba(16, 24, 40, 0.32); }
  dialog h2 { margin: 0 0 8px; font-size: 18px; }
  dialog dl { display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; font-size: 13px; }
  dialog dt { color: var(--muted); }
  dialog dd { margin: 0; word-break: break-all; }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }

  [hidden] { display: none !important; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <p class="eyebrow">账户设置</p>
    <h1>用户资料</h1>
    <p class="muted">修改后会保存在本地 mock 存储中，不会发往任何服务器。</p>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <form id="profile-form" novalidate>
    <fieldset id="fields">
      <legend class="sr-only">资料字段</legend>

      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" name="nickname" type="text" maxlength="24" autocomplete="nickname"
               aria-describedby="nickname-hint nickname-error" aria-invalid="false" required>
        <p id="nickname-hint" class="hint">必填，最多 24 个字符。</p>
        <p id="nickname-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="email"
               aria-describedby="email-hint email-error" aria-invalid="false" required>
        <p id="email-hint" class="hint">用于接收账户通知。</p>
        <p id="email-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="bio">简介</label>
        <div class="row">
          <span id="bio-hint" class="hint">选填，最多 160 个字符。</span>
          <span id="bio-count" class="hint">0 / 160</span>
        </div>
        <textarea id="bio" name="bio" maxlength="160"
                  aria-describedby="bio-hint bio-error" aria-invalid="false"></textarea>
        <p id="bio-error" class="error" hidden></p>
      </div>
    </fieldset>

    <div class="actions">
      <span id="state-hint" class="hint">尚未修改</span>
      <button id="submit" class="primary" type="button" disabled>保存资料</button>
    </div>
  </form>

  <details class="dev">
    <summary>失败路径演示</summary>
    <label><input type="checkbox" id="fail-500"> 下一次保存返回 500</label>
    <label><input type="checkbox" id="fail-422"> 下一次保存返回 422</label>
    <p class="hint">勾选后保存会失败，可以继续修改并再次确认提交。</p>
  </details>
</main>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title">确认保存资料？</h2>
    <p class="muted">保存后立即覆盖当前资料，且只能在本地 mock 中回滚。</p>
    <dl id="confirm-summary"></dl>
    <div class="dialog-actions">
      <button class="ghost" value="cancel">再检查一下</button>
      <button class="primary" value="confirm">确认保存</button>
    </div>
  </form>
</dialog>

<script type="module">
import { createMockApi } from './src/mockApi.mjs';
import { createFormMachine } from './src/formMachine.mjs';
import { LIMITS } from './src/validation.mjs';

const USER_ID = 'user-001';
const STORAGE_KEY = 'h1.profile';
const DEFAULT_PROFILE = { nickname: 'zj', email: 'zj@example.com', bio: 'AI-Native 实践者' };

let saved = null;
try {
  saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
} catch {
  saved = null;
}

const initialProfile = (saved && saved.profile) || DEFAULT_PROFILE;
const api = createMockApi({
  initial: { [USER_ID]: initialProfile },
  onPersist: (record) => localStorage.setItem(STORAGE_KEY, JSON.stringify(record))
});
const machine = createFormMachine({ userId: USER_ID, profile: initialProfile, api });

const els = {
  fields: document.getElementById('fields'),
  form: document.getElementById('profile-form'),
  submit: document.getElementById('submit'),
  banner: document.getElementById('banner'),
  stateHint: document.getElementById('state-hint'),
  bioCount: document.getElementById('bio-count'),
  dialog: document.getElementById('confirm-dialog'),
  summary: document.getElementById('confirm-summary'),
  fail500: document.getElementById('fail-500'),
  fail422: document.getElementById('fail-422'),
  inputs: {
    nickname: document.getElementById('nickname'),
    email: document.getElementById('email'),
    bio: document.getElementById('bio')
  },
  errors: {
    nickname: document.getElementById('nickname-error'),
    email: document.getElementById('email-error'),
    bio: document.getElementById('bio-error')
  }
};

let step = 0;
let current = machine.snapshot();

const STATE_LABEL = {
  idle: '尚未修改',
  validating: '编辑中',
  submitting: '保存中',
  success: '已保存',
  error: '待修正'
};

function render(snapshot) {
  current = snapshot;

  for (const field of Object.keys(els.inputs)) {
    const input = els.inputs[field];
    const message = snapshot.errors[field] || '';
    if (document.activeElement !== input && input.value !== (snapshot.profile[field] ?? '')) {
      input.value = snapshot.profile[field] ?? '';
    }
    input.classList.toggle('invalid', Boolean(message));
    input.setAttribute('aria-invalid', message ? 'true' : 'false');
    els.errors[field].textContent = message;
    els.errors[field].hidden = !message;
  }

  const bioLength = (snapshot.profile.bio || '').length;
  els.bioCount.textContent = `${bioLength} / ${LIMITS.bio}`;

  const busy = snapshot.final_state === 'submitting';
  els.fields.disabled = busy;
  els.submit.disabled = !snapshot.valid || busy;
  els.submit.textContent = busy ? '保存中…' : '保存资料';
  els.stateHint.textContent = STATE_LABEL[snapshot.final_state] || snapshot.final_state;

  if (snapshot.feedback) {
    els.banner.hidden = false;
    els.banner.textContent = snapshot.feedback.message;
    els.banner.dataset.kind = snapshot.feedback.kind;
    const isError = snapshot.feedback.kind === 'error';
    els.banner.setAttribute('role', isError ? 'alert' : 'status');
    els.banner.setAttribute('aria-live', isError ? 'assertive' : 'polite');
  } else {
    els.banner.hidden = true;
    els.banner.textContent = '';
    delete els.banner.dataset.kind;
  }
}

for (const field of Object.keys(els.inputs)) {
  els.inputs[field].addEventListener('input', async (event) => {
    await machine.dispatch({
      seq: ++step,
      role: 'user',
      action: 'edit',
      field,
      value: event.target.value
    });
    render(machine.snapshot());
  });
}

els.submit.addEventListener('click', () => {
  if (!current.valid || current.final_state === 'submitting') return;
  els.summary.innerHTML = '';
  for (const field of ['nickname', 'email', 'bio']) {
    const dt = document.createElement('dt');
    dt.textContent = field === 'nickname' ? '昵称' : field === 'email' ? '邮箱' : '简介';
    const dd = document.createElement('dd');
    dd.textContent = current.profile[field] || '（空）';
    els.summary.append(dt, dd);
  }
  els.dialog.showModal();
});

els.dialog.addEventListener('close', async () => {
  if (els.dialog.returnValue !== 'confirm') return;

  await machine.dispatch({ seq: ++step, role: 'user', action: 'submit' });
  render(machine.snapshot());
  if (machine.snapshot().final_state !== 'submitting') return;

  if (els.fail500.checked) {
    api.injectFailure(500);
    els.fail500.checked = false;
  } else if (els.fail422.checked) {
    api.injectFailure(422);
    els.fail422.checked = false;
  }

  await machine.dispatch({ seq: ++step, role: 'system', action: 'persist' });
  render(machine.snapshot());
});

render(current);
</script>
</body>
</html>
