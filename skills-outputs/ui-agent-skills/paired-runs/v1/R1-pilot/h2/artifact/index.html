<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户资料编辑</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <div>
          <p class="eyebrow">账号设置</p>
          <h1>用户资料</h1>
          <p class="lede">修改昵称、邮箱与个人简介，保存前请确认。</p>
        </div>
        <span id="state-badge" class="badge" data-state="idle">idle</span>
      </header>

      <form id="profile-form" novalidate>
        <fieldset id="fields">
          <label class="field" for="nickname">
            <span class="label-text">昵称 <em>必填</em></span>
            <input
              id="nickname"
              name="nickname"
              type="text"
              autocomplete="nickname"
              maxlength="32"
              aria-describedby="nickname-error"
            />
            <small id="nickname-error" class="field-error" role="alert"></small>
          </label>

          <label class="field" for="email">
            <span class="label-text">邮箱 <em>必填</em></span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              aria-describedby="email-error"
            />
            <small id="email-error" class="field-error" role="alert"></small>
          </label>

          <label class="field" for="bio">
            <span class="label-text">
              简介
              <span id="bio-count" class="counter">0/140</span>
            </span>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              aria-describedby="bio-error"
            ></textarea>
            <small id="bio-error" class="field-error" role="alert"></small>
          </label>
        </fieldset>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="toolbar">
          <div class="simulate">
            <label for="simulate">模拟保存结果</label>
            <select id="simulate">
              <option value="200">200 成功</option>
              <option value="422">422 校验失败</option>
            </select>
          </div>
          <div class="actions">
            <button type="button" id="reset" class="ghost">重新加载</button>
            <button type="submit" id="submit" class="primary" disabled>保存资料</button>
          </div>
        </div>
      </form>

      <p class="gates">审计：<span id="gates">尚未提交确认</span></p>
    </main>

    <dialog id="confirm-dialog" class="dialog">
      <h2>确认保存以下资料？</h2>
      <div id="confirm-summary" class="summary"></div>
      <p class="hint">点击「确认保存」后才会写入，取消则不会提交。</p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="ghost">取消</button>
        <button type="button" id="confirm-ok" class="primary">确认保存</button>
      </div>
    </dialog>

    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
